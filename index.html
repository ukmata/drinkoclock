function getTimeInZone(tz) {
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, hour: 'numeric', minute: '2-digit', hour12: false
  }).formatToParts(new Date());
  let hour = parseInt(parts.find(p => p.type === 'hour').value, 10);
  if (hour === 24) hour = 0;
  const minute = parts.find(p => p.type === 'minute').value;
  return {
    hour,
    minute,
    display: `${hour.toString().padStart(2,'0')}:${minute}`
  };
}
 
// Hour (0–23) when drink'o'clock starts. Set to 19 for a later start.
const DRINK_START_HOUR = 18;
 
function vibeFor(hour) {
  if (hour >= 18 && hour < 20) return "Prime aperitivo time. Pull up a stool.";
  if (hour >= 20 && hour < 22) return "Dinner is in full swing. Grab a glass.";
  if (hour >= 22 && hour < 24) return "The bars are loud. The night is young.";
  if (hour >= 0 && hour < 3) return "Last call somewhere. Make it count.";
  return "A reasonable hour to imbibe somewhere on Earth.";
}
 
function isDrinkingHour(hour) {
  return hour >= DRINK_START_HOUR || hour < 3;
}
 
function localSubtitleFor(hour) {
  // Pre-dawn / very early morning: hard "too early" with a wink
  if (hour >= 3 && hour < 8) {
    return {
      text: "It's a bit early to drink — but if you were already going to, we won't tell.",
      tone: "early"
    };
  }
  // Mid-morning: still officially early, softer nudge
  if (hour >= 8 && hour < 11) {
    return {
      text: "Bit early, isn't it? But hey — somewhere in the world it's already happy hour.",
      tone: "early"
    };
  }
  // Late morning / borderline: brunch territory
  if (hour >= 11 && hour < 12) {
    return {
      text: "Almost noon. Mimosa hour, technically. We'll allow it.",
      tone: "borderline"
    };
  }
  // Afternoon before drink'o'clock: not quite, but defensible
  if (hour >= 12 && hour < DRINK_START_HOUR) {
    return {
      text: "It's past noon — and somewhere in the world, the night is just getting going.",
      tone: "borderline"
    };
  }
  // DRINK_START_HOUR onwards: green light
  return {
    text: "It's always drink'o'clock somewhere. Let's find out where.",
    tone: "ok"
  };
}
 
function showMyTime() {
  const now = new Date();
  const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  document.getElementById('myTime').textContent = `It's ${time} where you are`;
 
  const sub = localSubtitleFor(now.getHours());
  const subEl = document.getElementById('subtitle');
  subEl.textContent = sub.text;
  subEl.dataset.tone = sub.tone;
}
 
let lastPickName = null;
let lastShareText = '';
 
// GetYourGuide affiliate partner ID. Leave empty until you have one;
// the links still work, they just don't earn commission.
const GYG_PARTNER_ID = '';
 
// tourQuery overrides the GetYourGuide search for cities where
// the default pub crawl search finds nothing or the wrong place.
// Set it to false to hide the link where GetYourGuide has no listings.
function tourUrlFor(city) {
  const params = new URLSearchParams({ q: city.tourQuery || `Pub crawls & bar tours, ${city.name}` });
  if (GYG_PARTNER_ID) params.set('partner_id', GYG_PARTNER_ID);
  return `https://www.getyourguide.com/s/?${params}`;
}
 
async function shareDrink() {
  const url = 'https://drinkoclock.app/';
  const btn = document.getElementById('shareBtn');
  const message = `${lastShareText} ${url}`;
  if (navigator.share) {
    try {
      // Link goes inside the text rather than as a separate `url`: some
      // Android share targets (WhatsApp, Oppo/ColorOS) drop the text otherwise.
      await navigator.share({ title: "drink'o'clock", text: message });
      return;
    } catch (e) {
      if (e.name === 'AbortError') return;
    }
  }
  try {
    await navigator.clipboard.writeText(message);
    btn.textContent = 'Copied to clipboard!';
  } catch (e) {
    btn.textContent = "Couldn't copy, sorry";
  }
  setTimeout(() => { btn.textContent = 'Share this round'; }, 2000);
}
 
function findDrink() {
  const candidates = cities.filter(c => isDrinkingHour(getTimeInZone(c.tz).hour));
  const pool = candidates.length > 0 ? candidates : cities;
  let pick;
  // avoid repeating the same city twice in a row if possible
  let tries = 0;
  do {
    pick = pool[Math.floor(Math.random() * pool.length)];
    tries++;
  } while (pick.name === lastPickName && pool.length > 1 && tries < 5);
  lastPickName = pick.name;
 
  const time = getTimeInZone(pick.tz);
  document.getElementById('city').textContent = pick.name;
  document.getElementById('country').textContent = pick.country;
  document.getElementById('localTime').textContent = `Local time: ${time.display}`;
  document.getElementById('vibe').textContent = vibeFor(time.hour);
  document.getElementById('drink').textContent = pick.drink;
 
  lastShareText = `It's ${time.display} in ${pick.name} 🍸 House pour: ${pick.drink}.`;
  const shareMessage = encodeURIComponent(`${lastShareText} https://drinkoclock.app/`);
  document.getElementById('waLink').href = `https://wa.me/?text=${shareMessage}`;
  document.getElementById('xLink').href = `https://x.com/intent/tweet?text=${shareMessage}`;
  const tour = document.getElementById('tourLink');
  tour.hidden = pick.tourQuery === false;
  tour.href = tourUrlFor(pick);
  tour.textContent = pick.tourQuery
    ? `Tours & experiences in ${pick.name} →`
    : `Pub crawls & bar tours in ${pick.name} →`;
 
  const result = document.getElementById('result');
  result.classList.remove('show');
  void result.offsetWidth;
  result.classList.add('show');
}
 
showMyTime();
