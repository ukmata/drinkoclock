<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>drink'o'clock</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container { max-width: 600px; width: 100%; text-align: center; }
  h1 {
    font-size: clamp(2rem, 6vw, 2.8rem);
    margin-bottom: 0.5rem;
    background: linear-gradient(135deg, #f5d76e, #e67e22);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1.1;
  }
  .subtitle { font-size: 1rem; opacity: 0.7; margin-bottom: 1.5rem; line-height: 1.5; transition: color 0.3s; }
  .subtitle[data-tone="early"] { color: #f5b76e; opacity: 0.9; }
  .subtitle[data-tone="borderline"] { color: #f5d76e; opacity: 0.85; }
  .my-time { font-size: 0.9rem; opacity: 0.6; margin-bottom: 2rem; }
  button {
    background: linear-gradient(135deg, #e67e22, #c0392b);
    color: white;
    border: none;
    padding: 1.2rem 2.5rem;
    font-size: 1.15rem;
    font-weight: 600;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(230, 126, 34, 0.4);
    transition: transform 0.15s, box-shadow 0.15s;
    letter-spacing: 0.5px;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(230, 126, 34, 0.55); }
  button:active { transform: translateY(0); }
  .result {
    margin-top: 2.5rem;
    padding: 2rem;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.4s, transform 0.4s;
    display: none;
  }
  .result.show { opacity: 1; transform: translateY(0); display: block; }
  .city { font-size: clamp(1.8rem, 5vw, 2.4rem); font-weight: 700; margin-bottom: 0.2rem; }
  .country { font-size: 1rem; opacity: 0.7; margin-bottom: 1rem; letter-spacing: 1px; text-transform: uppercase; }
  .local-time { font-size: 1.5rem; color: #f5d76e; margin-bottom: 1rem; font-variant-numeric: tabular-nums; }
  .vibe { font-style: italic; margin-bottom: 1.2rem; opacity: 0.9; line-height: 1.5; }
  .drink {
    padding: 1rem;
    background: rgba(245, 215, 110, 0.08);
    border-radius: 12px;
    border: 1px solid rgba(245, 215, 110, 0.3);
  }
  .drink-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    opacity: 0.6;
    display: block;
    margin-bottom: 0.4rem;
  }
  #drink { font-size: 1.05rem; }
  .footer { margin-top: 2rem; font-size: 0.8rem; opacity: 0.4; }
</style>
</head>
<body>
<div class="container">
  <h1>drink'o'clock</h1>
  <p class="subtitle" id="subtitle">It's always drink'o'clock somewhere. Let's find out where.</p>
  <p class="my-time" id="myTime"></p>
  <button onclick="findDrink()">Pour Me a Destination</button>
  <div class="result" id="result">
    <div class="city" id="city"></div>
    <div class="country" id="country"></div>
    <div class="local-time" id="localTime"></div>
    <div class="vibe" id="vibe"></div>
    <div class="drink">
      <span class="drink-label">House Pour</span>
      <span id="drink"></span>
    </div>
  </div>
  <p class="footer">Please drink responsibly.</p>
</div>
 
<script>
const cities = [
  { name: 'Tokyo', country: 'Japan', tz: 'Asia/Tokyo', drink: "A whisky highball at a tiny Shinjuku bar" },
  { name: 'Seoul', country: 'South Korea', tz: 'Asia/Seoul', drink: "Soju with fried chicken" },
  { name: 'Bangkok', country: 'Thailand', tz: 'Asia/Bangkok', drink: "A frosty Singha on a rooftop" },
  { name: 'Singapore', country: 'Singapore', tz: 'Asia/Singapore', drink: "A Singapore Sling at Raffles" },
  { name: 'Hong Kong', country: 'China', tz: 'Asia/Hong_Kong', drink: "A craft cocktail in Lan Kwai Fong" },
  { name: 'Mumbai', country: 'India', tz: 'Asia/Kolkata', drink: "An ice-cold Kingfisher" },
  { name: 'Dubai', country: 'UAE', tz: 'Asia/Dubai', drink: "A skyline cocktail above the city" },
  { name: 'Tel Aviv', country: 'Israel', tz: 'Asia/Jerusalem', drink: "A glass of arak by the beach" },
  { name: 'Istanbul', country: 'Türkiye', tz: 'Europe/Istanbul', drink: "Yeni Raki with doner" },
  { name: 'Athens', country: 'Greece', tz: 'Europe/Athens', drink: "Ouzo on the rocks" },
  { name: 'Rome', country: 'Italy', tz: 'Europe/Rome', drink: "An Aperol Spritz at golden hour" },
  { name: 'Paris', country: 'France', tz: 'Europe/Paris', drink: "A glass of Bordeaux at a corner café" },
  { name: 'Berlin', country: 'Germany', tz: 'Europe/Berlin', drink: "A Pilsner in a beer garden" },
  { name: 'Prague', country: 'Czechia', tz: 'Europe/Prague', drink: "A pint of pure Pilsner Urquell" },
  { name: 'Madrid', country: 'Spain', tz: 'Europe/Madrid', drink: "A jug of sangria with tapas" },
  { name: 'Amsterdam', country: 'Netherlands', tz: 'Europe/Amsterdam', drink: "A Heineken canalside" },
  { name: 'Copenhagen', country: 'Denmark', tz: 'Europe/Copenhagen', drink: "A glass of aquavit" },
  { name: 'London', country: 'United Kingdom', tz: 'Europe/London', drink: "A pint of bitter at the local" },
  { name: 'Edinburgh', country: 'Scotland', tz: 'Europe/London', drink: "A peaty single malt, neat" },
  { name: 'Dublin', country: 'Ireland', tz: 'Europe/Dublin', drink: "A perfectly poured Guinness" },
  { name: 'Lisbon', country: 'Portugal', tz: 'Europe/Lisbon', drink: "A glass of tawny Port" },
  { name: 'Reykjavik', country: 'Iceland', tz: 'Atlantic/Reykjavik', drink: "A shot of Brennivín, brave soul" },
  { name: 'Buenos Aires', country: 'Argentina', tz: 'America/Argentina/Buenos_Aires', drink: "A glass of Mendoza Malbec" },
  { name: 'São Paulo', country: 'Brazil', tz: 'America/Sao_Paulo', drink: "A Caipirinha, naturally" },
  { name: 'Lima', country: 'Peru', tz: 'America/Lima', drink: "A frothy Pisco Sour" },
  { name: 'Bogotá', country: 'Colombia', tz: 'America/Bogota', drink: "Aguardiente with the locals" },
  { name: 'New York', country: 'USA', tz: 'America/New_York', drink: "A Manhattan, dealer's choice" },
  { name: 'Nashville', country: 'USA', tz: 'America/Chicago', drink: "Bourbon, neat, with live music" },
  { name: 'Chicago', country: 'USA', tz: 'America/Chicago', drink: "An Old Fashioned" },
  { name: 'New Orleans', country: 'USA', tz: 'America/Chicago', drink: "A Sazerac in the French Quarter" },
  { name: 'Denver', country: 'USA', tz: 'America/Denver', drink: "A craft IPA at altitude" },
  { name: 'Los Angeles', country: 'USA', tz: 'America/Los_Angeles', drink: "A skinny margarita on a patio" },
  { name: 'San Francisco', country: 'USA', tz: 'America/Los_Angeles', drink: "A Negroni with a view of the bay" },
  { name: 'Mexico City', country: 'Mexico', tz: 'America/Mexico_City', drink: "Mezcal, neat, with orange and sal de gusano" },
  { name: 'Havana', country: 'Cuba', tz: 'America/Havana', drink: "A Mojito on a rooftop" },
  { name: 'Honolulu', country: 'USA', tz: 'Pacific/Honolulu', drink: "A Mai Tai by the sea" },
  { name: 'Sydney', country: 'Australia', tz: 'Australia/Sydney', drink: "A Hunter Valley shiraz at the harbour" },
  { name: 'Melbourne', country: 'Australia', tz: 'Australia/Melbourne', drink: "An Espresso Martini in a laneway bar" },
  { name: 'Auckland', country: 'New Zealand', tz: 'Pacific/Auckland', drink: "A Marlborough Sauvignon Blanc" },
  { name: 'Cape Town', country: 'South Africa', tz: 'Africa/Johannesburg', drink: "A Stellenbosch Pinotage at sunset" },
  { name: 'Cairo', country: 'Egypt', tz: 'Africa/Cairo', drink: "A Stella beer by the Nile" },
  { name: 'Marrakech', country: 'Morocco', tz: 'Africa/Casablanca', drink: "A glass of Moroccan red in the medina" },
  { name: 'Nairobi', country: 'Kenya', tz: 'Africa/Nairobi', drink: "A cold Tusker at sundown" },
  { name: 'Prishtinë', country: 'Kosovo', tz: 'Europe/Amsterdam', drink: "Raki with mezze, slowly" },
];
 
function getTimeInZone(tz) {
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, hour: 'numeric', minute: '2-digit', hour12: false
  }).formatToParts(new Date());
  let hour = parseInt(parts.find(p => p.type === 'hour').value, 10);
  if (hour === 24) hour = 0;
  const minute = parts.find(p => p.type === 'minute').value;
  return {
    hour,
    minute,
    display: `${hour.toString().padStart(2,'0')}:${minute}`
  };
}
 
// Hour (0–23) when drink'o'clock starts. Set to 19 for a later start.
const DRINK_START_HOUR = 18;
 
function vibeFor(hour) {
  if (hour >= 18 && hour < 20) return "Prime aperitivo time. Pull up a stool.";
  if (hour >= 20 && hour < 22) return "Dinner is in full swing. Grab a glass.";
  if (hour >= 22 && hour < 24) return "The bars are loud. The night is young.";
  if (hour >= 0 && hour < 3) return "Last call somewhere. Make it count.";
  return "A reasonable hour to imbibe somewhere on Earth.";
}
 
function isDrinkingHour(hour) {
  return hour >= DRINK_START_HOUR || hour < 3;
}
 
function localSubtitleFor(hour) {
  // Pre-dawn / very early morning: hard "too early" with a wink
  if (hour >= 3 && hour < 8) {
    return {
      text: "It's a bit early to drink — but if you were already going to, we won't tell.",
      tone: "early"
    };
  }
  // Mid-morning: still officially early, softer nudge
  if (hour >= 8 && hour < 11) {
    return {
      text: "Bit early, isn't it? But hey — somewhere in the world it's already happy hour.",
      tone: "early"
    };
  }
  // Late morning / borderline: brunch territory
  if (hour >= 11 && hour < 12) {
    return {
      text: "Almost noon. Mimosa hour, technically. We'll allow it.",
      tone: "borderline"
    };
  }
  // Afternoon before drink'o'clock: not quite, but defensible
  if (hour >= 12 && hour < DRINK_START_HOUR) {
    return {
      text: "It's past noon — and somewhere in the world, the night is just getting going.",
      tone: "borderline"
    };
  }
  // DRINK_START_HOUR onwards: green light
  return {
    text: "It's always drink'o'clock somewhere. Let's find out where.",
    tone: "ok"
  };
}
 
function showMyTime() {
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const now = new Date();
  const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  document.getElementById('myTime').textContent = `It's ${time} where you are (${tz})`;
 
  const sub = localSubtitleFor(now.getHours());
  const subEl = document.getElementById('subtitle');
  subEl.textContent = sub.text;
  subEl.dataset.tone = sub.tone;
}
 
let lastPickName = null;
 
function findDrink() {
  const candidates = cities.filter(c => isDrinkingHour(getTimeInZone(c.tz).hour));
  const pool = candidates.length > 0 ? candidates : cities;
  let pick;
  // avoid repeating the same city twice in a row if possible
  let tries = 0;
  do {
    pick = pool[Math.floor(Math.random() * pool.length)];
    tries++;
  } while (pick.name === lastPickName && pool.length > 1 && tries < 5);
  lastPickName = pick.name;
 
  const time = getTimeInZone(pick.tz);
  document.getElementById('city').textContent = pick.name;
  document.getElementById('country').textContent = pick.country;
  document.getElementById('localTime').textContent = `Local time: ${time.display}`;
  document.getElementById('vibe').textContent = vibeFor(time.hour);
  document.getElementById('drink').textContent = pick.drink;
 
  const result = document.getElementById('result');
  result.classList.remove('show');
  void result.offsetWidth;
  result.classList.add('show');
}
 
showMyTime();
setInterval(showMyTime, 60000);
</script>
</body>
</html>
